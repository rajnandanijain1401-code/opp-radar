name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: dropdown
    id: mode
    attributes:
      label: Which mode?
      options: [GitHub Actions (OSS), Claude mode, Hosted web app, Local CLI]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands you ran, config snippets (no secrets), and the relevant part of out/run-report.json if any.
  - type: input
    id: version
    attributes:
      label: Commit or version
